# config/capabilities.yaml — capability tokens added after the built-in
# set in src/core/capabilities.ts was frozen.
#
# A tool shipped in a merged PR that needs a capability the built-in enum
# does not have adds it here, in the same PR as the tool. The orchestrator
# hot-reloads this file: the new token becomes grantable to specialists
# with no enum edit, recompile, or restart. The built-in capabilities
# still live in capabilities.ts — this file extends that set, it does not
# replace it.
#
# Format — one entry per token:
#   <token>: <one-line description of what a tool gated on it may do>
#
# Tokens are lowercase snake_case, like the built-ins.

write_process_miss: open and update process-miss records — a DOMAIN specialist (e.g. Kristi's acquire_quickspecs rejecting an implausible spec) or a meta-agent uses this to FILE a miss. It does NOT mean "manage the ledger"; see drive_process_misses for that.
drive_process_misses: get the WHOLE open-miss ledger surfaced in your deliberation pass and drive each one's lifecycle via the envelope's `miss_actions` (route / dispatch_redo / verify / close / escalate). Program-management work — the meta-agents (Mariah, Beatrice) only. A domain specialist that merely FILES misses (write_process_miss) must NOT hold this, or the entire system-wide ledger bloats their deliberation prompt for work that isn't theirs (the Kristi 49k-context overflow, 2026-06-08).
dispatch_proposal: execute an approved-but-stalled proposal — invoke its action as the owning specialist
consult_deep_model: escalate a hard, scoped sub-question to the 35B depth model for a one-shot deep answer (consult_deep_model tool)
download_files: download a file from the web into the categorized hearth-library store (download_to_library tool)
manage_media: search, read, and add titles in the household media apps — Sonarr/Radarr/Lidarr/Readarr (arr connector tools)
recommend_media: surface a thematic media recommendation into the Listening pane's "Worth a look" section, deduped against the existing library before it shows (suggest_media tool). Maggie only. Distinct from manage_media — it never acquires anything, only advises.
track_show_attendance: mark an upcoming show as one Jasper already has tickets to so it stops surfacing + triggers openers/adjacent research (mark_show_going tool). Maggie only. Mutates the same upcoming_shows store as track_upcoming_shows but is the attendance signal, not the capture signal.
read_inbox: read the specialist's own inbox during a chat or deliberation turn — scoped to ctx.specialist_id, never cross-specialist (read_inbox tool)
manage_torrents: queue, list, and remove torrents in qBittorrent — Maggie's ad-hoc grab surface alongside the *arr-stack's automated downloads (qbittorrent connector tools)
manage_youtube_downloads: queue, list, and remove yt-dlp downloads via MeTube — Maggie's YouTube + general yt-dlp-supported-site surface (metube connector tools)
write_vault_media: append structured observations to Knowledge/Maggie/memory.md — Maggie's running notes on Jasper's media taste, watch history mentions, and concert research outputs (update_maggie_memory tool)
read_meal_plan: read recipes and dinner-plan history from the Mealie instance — mealie_search_recipes, mealie_get_recipe, mealie_get_meal_plan_history
write_meal_plan: publish a draft weekly dinner plan into Mealie — mealie_set_meal_plan
manage_recipes: import a recipe from a URL into Mealie's library — mealie_import_recipe_url
read_household_diets: read per-household-member dietary restrictions, preferences, and dislikes from config/users.yaml — get_household_diets
write_household_diets: write back to a household member's `dietary:` block in config/users.yaml — update_household_diet (Brigid only); chat-driven calibration of calorie targets, macro goals, restrictions, and preferences
write_vault_brigid: append structured plan summaries and curation notes to Knowledge/Brigid/ (plans/<date>.md, backlog.md, memory.md) — brigid's vault writers
write_vault_linda: persist marketplace listing drafts (the three platform listings she composes for an item) — gates Linda's draft_listing tool, which saves a per-user listing_drafts row and renders the copy-ready listing card
read_plex_consumption: read Plex consumption signals via Tautulli — watch history, heavy-rotation leaderboards, per-user breakdowns (plex_history, plex_heavy_rotation tools). Maggie + Cordelia hold this; the data is "what was actually watched/played," not just "what's in the library."
read_plex_library: read the Plex server directly — library section index, currently-playing sessions, on-deck items, and user star ratings (plex_library, plex_now_playing, plex_ratings tools). Maggie holds this; Cordelia could be granted it if she ever needs Plex-side metadata that Tautulli doesn't surface.
auto_apply_low_risk: apply structurally-bounded, low-risk YAML edits to a specialist's config without a binding-proposal queue trip (apply_low_risk_fix tool). Beatrice-only by design — the tool itself enforces the safe-set + audits every change. Granting elsewhere defeats the gate.
analyze_image: hand an image (path or bytes) to the local Qwen2.5-VL endpoint for a structured description + suggested-specialist hint (vl.analyze_image tool). Cordelia fans the result through her capture classifier; Linda also holds it — a resale specialist must be able to SEE the product photo a seller shares to write the listing.
ocr_image: extract text from an image via the local PaddleOCR sidecar (ocr.ocr_image tool). Cordelia uses it when the iOS-side Vision OCR is empty/non-English; Linda uses it to read text off a product/listing screenshot (brand, model, price, specs).
read_reddit: read public reddit JSON endpoints — subreddit listings, thread comments, and user activity (submissions/comments overview). Ruby holds it to track r/Pleasantville community signal and the public posts of officials and civic figures on local issues. Anonymous JSON-endpoint reads; rate-limited; reddit blocks aggressive scrapers, so the tool returns recovery hints pointing at browse_url on 429/403 (a block is an access failure, not a signal about any account's status). No OAuth, no API key, no PRAW — public reads only. (read_subreddit, read_reddit_thread, read_reddit_user tools)
read_property_records: read the local your county County assessor cache (parcels, values, characteristics, sales) and refresh it from the county public roll CSVs — gates Anna's sync_county_assessor_data, lookup_parcel, find_comps, and assess_protest_case tools. Public-records reads + a bulk-download sync; no PII beyond what the county publishes openly. Anna only.
write_vault_property: write a property protest evidence packet + per-parcel working files under Property/<parcel>/ — gates Anna's draft_evidence_packet tool, which renders the copy/print-ready packet markdown the owner takes into a protest/abatement hearing. Anna only.
read_workstation_intel: read Kristi's structured workstation-intelligence cache — SKUs, specs, prices over time, GPU options, ISV certs, and cert-registry leak sightings (lookup_workstation, compare_configs, price_history, leak_radar, hp_z_gaps, isv_matrix tools). Local cache reads only. Kristi only.
write_workstation_intel: write normalized rows into Kristi's workstation cache and the cert-registry leak radar — gates record_sku, record_price, record_isv_cert, reconcile_cert_sighting, and the scan_cert_registries sweep. Kristi only.
read_specialist_spec: read the live staff roster, or one specialist's DEFINITION — persona, role, voice, tools_for_chat/deliberation, trusted_sources tiers, knowledge_scope, granted capabilities (read_specialist_spec tool). Omitting specialist_id enumerates the roster into staff vs folded-internal; that is the ONLY grounded answer to "who is on your staff" and is why Kate holds this as well as Cordelia (2026-08-02 — she was confabulating a roster from memory). Cordelia uses the per-specialist read for her "expert on what makes specialists experts" role, auditing the spec rather than just the library shelf. Read-only, no secrets (the YAML is config, not credentials).
manage_scrum: create/update/move epics, create/commit/close sprints, capture retros + notes on Beatrice's scrum/dev-board — gates the scrum_board_read (read), scrum_epic_write, scrum_sprint_write, and scrum_note_retro_write tools. The board tracks feature-adds + bug-adds for building Hearth itself, partitioned backend|ios and ROI/severity-ranked; blocking judgment calls file a scrum_decision proposal rather than a separate queue. Beatrice only — owner-scoped internal dev work.
write_vault_luna: write into Luna's house-steward ledgers under Knowledge/Luna/ — the systems inventory, the maintenance cadence calendar, the dated maintenance log, the service-provider ledger, and her memory (update_luna_vault tool). Paths are hardcoded in the tool so the grant can't scribble elsewhere. Luna only.
drive_roster_gaps: get the roster-gap report (unclaimed-domain evidence mined from Cordelia's triage interrupts + unattributed knowledge demand) surfaced in your deliberation pass, and convert clusters that clear the evidence bar into propose_hire packets. Staffing oversight — Kate only; the report is meaningless to a domain specialist.
read_civic_intel: read Ruby's structured civic-intelligence ledger — campaign donations, donor rollups, finance filings, member interests, and conflict-of-interest flags with their review status (query_civic_finance, member_dossier tools). Public-record facts, every row cited. Ruby only.
write_civic_intel: write normalized rows into Ruby's civic ledger — gates record_donation, record_member_interest, record_conflict_flag, the acquire_campaign_finance pass, the scan_conflicts sweep, and record_civic_campaign (the household's active fights — stake, position, talking points, targets, next milestone, attached deep_research investigations, and the won/lost/closed outcome). Every money row requires a source_url; amounts pass a plausibility gate at the store chokepoint. Ruby only.
write_news_takes: compose Kate's Read — her citation-verified lead + per-category takes over the News Desk's fresh headlines (compose_news_takes, the 04:10 background job). Writes the news_takes table + shelves the daily "Kate's read" note. Kate only — the desk is her office surface; the citation gate (no resolvable headline cites, no take) lives in the tool.
read_news: read the News Desk's fresh headlines grouped by category, each with its source domain (query_news_items). A brief-time read so the morning brief opens with overnight news, cited by source. Generic by design — any news-reading specialist may hold it; today Kate, for the 07:00 brief.
run_research_commissions: file, read, and advance durable deep-research commissions — multi-subtopic repository builds that plan via the planner model, fan out searches, fetch + quality-gate + shelve documents (direct PDF/DOCX seeds included) onto a target specialist's library, then synthesize a repository guide and flag the target (commission_research / list_research_commissions / advance_research_commissions tools). Cordelia only — commissions spend real acquisition budget and write cross-shelf; out-of-roster domains shelve only past the source judge, with roster proposals filed at completion.
deep_research: file, follow, and read back subject-oriented deep-research investigations — "go find out everything about X" (a person, product, place, or decision). The deep_research tool hands the ask to a DETACHED background runner that decomposes the subject into sub-questions, fans out web searches, fetches + reads sources with [S#] citations, adversarially verifies the load-bearing claims, and synthesizes a cited dossier shelved to the library (searchable) — escaping the chat turn's fetch/round/token ceiling. list_research_investigations / get_research_investigation read status + the finished dossier; the office route (GET /api/specialists/:id/research) also gates on this. The runner does the browsing with its own context, so a holder needs no query_web/browse_web. Kate holds it (she's who gets asked and reports back) and Ruby holds it as of 2026-07-28 (a civic campaign carries standing background work — an officeholder's full record, what a charter process requires, where a contract landed elsewhere — that no bounded turn can do justice). Grant to any research front; the tool is agent-agnostic and attributes to ctx.specialist_id. Owner/household only — investigations spend real fetch budget; each is cordoned private_to the requester.
monitor_system_health: assess + surface the health of Hearth's external dependencies (Firecrawl, SearXNG, the browser fetcher, embeddings/reranker, Home Assistant, …) — gates Kate's scan_system_health background job (probe + audit-log error-rate sweep that drives the health-incident ledger and, on a flip-to-down edge, files a process-miss for Beatrice + flags her + pushes the owner) and her system_health read tool ("is everything working?"). Read + internal-write (incidents/misses); no external effect. Kate only — she's the chief of staff who notices and triages; Beatrice fixes (remediate_infra).
monitor_capability_yield: "detect capabilities that RUN CLEANLY and produce nothing (scan_capability_yield) — the failure class error rate is structurally blind to. Every other quality signal keys on something going wrong (system_health on error rate, guard_feedback on a finalize-guard catch, the miss ledger on a failure); a background job that returns ok:true and writes zero rows trips none of them, which is how extract_meeting_votes ran 59 times over two months, fetched 82 documents, recorded 3 votes, and was reported healthy throughout. Deterministic SQL over background-job audit rows already on disk (no LLM, no new write path, works retroactively): a run with work available and no output is barren, a run with no input is idle and never a miss. Emits the existing quality_signal so the EXISTING guard-feedback driver files the miss and wakes Beatrice. Read + internal-write; no external effect. Kate only — she detects, Beatrice diagnoses (diagnose_capability_yield) and fixes."
convene_court: the Proposal Court tick (convene_proposal_court tool, job-only) — Kate + Beatrice (mechanism lens) + Mariah (evidence lens) sit as different-perspective skeptics over the AGED pending proposal queue. Internal/system kinds (recommendation / binding_proposal / persona_tuning / trusted_source_addition) are DECIDED on consensus through the same effects an owner tap produces; stale offers of ANY kind lapse with no XP effect; splits + floor-class items (step-up, hiring packets, send/spend-shaped) go to ONE owner digest. Authorship recusal (the filer's seat passes to the dense 27B, which also breaks ties); every verdict audited with all votes. Kate only — she chairs; DARK behind HEARTH_PROPOSAL_COURT.
drive_cases: the Case Driver tick (drive_open_cases tool, job-only) — walk every open process miss to PROVEN closure. Stale open/routed cases get ONE directed scoped wake at trainer (diagnose + fix); stale redo_dispatched cases wake Mariah (verify_fix_landed — closure from evidence, not optimism); cases still stuck after the nudge budget escalate ONCE to the owner as an aggregate recommendation, then hold. Deterministic (no LLM in the driver; the wakes are the model steps), durable per-miss cooldown markers, meta-loop-safe, fail-open per miss. Kate only — she is the chief of staff who owns follow-through; DARK behind HEARTH_CASE_DRIVER.
reflect_household: the walk-the-house reflection tick (reflect_household tool, job-only) — ONE nightly open-mandate deep-tier pass over the fused household picture (working memory) + her own durable observation ledger, noticing what is off / connected / undone that NO scheduled scan owns. Observations carry dispositions CHEAPEST FIRST (ignore/watch/investigate/act/ask); the ledger (kate_observations) dedups on content-stable anchors, keeps a recurrence trail, re-enters open watches into the next pass + the brief's watching section, and honors dismissed-stays-dismissed. Fail-CLOSED (a garbled envelope files nothing); act files a cordoned action_proposal through the normal court/owner path (≤2/pass, exists_for_signature-deduped) and is SEPARATELY gated — watch-only soak first, intended-vs-applied recorded per row (the scored-week discipline applied to initiative). Kate only — this is the self-direction spine; DARK behind HEARTH_KATE_REFLECTION (+_ACT for the act rung).
remediate_infra: restart a down dependency's container via the guarded ops-relay sidecar (restart_service tool) — the last rung of self-healing. Strictly bounded — it can only restart a service the ops-relay's env allowlist names, it circuit-breaks (escalates to the owner rather than restart-looping), it never claims "fixed" (the next health scan confirms real recovery), and it degrades to owner-escalation when the relay is unwired. Beatrice only — operational remediation belongs with the meta-agent who fixes the system; config/code faults stay in her reviewed change pipeline.
diagnose_infra: diagnose WHY a down dependency is failing, on the LOCAL deep model (diagnose_dependency tool) — the read-only diagnostic bridge between Kate detecting an outage and Beatrice fixing it. Gathers an evidence pack (the failing service's container logs via the read-only ops-relay /logs, the actual error strings from the audit log, the probe, the resolved config), has the deep model produce a root cause grounded ONLY in that evidence (the fact critic drops unsupported specifics), emits typed candidate fixes each adversarially scored on likelihood/risk/reversibility/blast-radius, persists the diagnosis, and files an owner recommendation with the ranked options. It NEVER applies a fix — every fix names an EXISTING gate (restart_service / apply_low_risk_fix / propose_code_edit / escalate). Beatrice only — the diagnosis precedes her remediation (remediate_infra) and her change pipeline.
diagnose_toolcalls: diagnose WHY a tool keeps failing argument validation, or why a specialist keeps tripping an honesty guard, on the LOCAL deep model — the tool-call sibling of diagnose_infra (diagnose_tool_failure + probe_interactive_endpoint tools). Reads the audit error text + the PROVIDED-vs-REQUIRED field-mismatch extraction, the failing tool's schema (required/optional/aliases/regex patterns), and PROBES the live interactive endpoint to localize blame (endpoint vs schema), then the deep model grounds a root cause in that evidence (the fact critic drops unsupported specifics) and emits typed, adversarially-scored fixes (rename_field / make_optional / add_alias / relax_contract / grounding_fix / code_change / escalate). It NEVER applies a fix — every fix names an EXISTING gate (propose_code_edit / propose_code_change / apply_low_risk_fix / escalate); the diagnosis precedes Beatrice's change pipeline. Read + internal-write (a recommendation proposal); no external effect. Beatrice only — she's woken by the guard-feedback driver on a recurring tool-call/honesty miss.
diagnose_capability_yield: "diagnose WHY a capability runs successfully and writes nothing, on the LOCAL deep model (diagnose_capability_yield tool) — the zero-output sibling of diagnose_infra and diagnose_toolcalls. The hard part is that there is no error to read: the evidence pack is the run series, the considered-vs-produced trend that says whether input is arriving and being dropped or never arriving at all, the job's schedule/config, the tool's source outline and any error samples. The deep model grounds a root cause in ONLY that evidence (the fact critic drops unsupported specifics) and emits typed, adversarially-scored fixes (stale_source / wrong_target / broken_filter / contract_drift / retire_capability / code_change / escalate) — retiring a capability that no longer has a purpose is a legitimate verdict, since a job that cannot produce is worse than absent because it reads as coverage. It NEVER applies a fix — every fix names an EXISTING gate (propose_code_edit / propose_code_change / apply_low_risk_fix / escalate). Beatrice only — she is woken by the guard-feedback driver on a barren-capability signal."
read_service_logs: read a service's recent container logs (read-only) via the guarded ops-relay (read_service_logs tool) — generalizes diagnose_infra's dependency-scoped log read to any allowlisted service, so Beatrice can read the orchestrator's OWN logs ([tool-recovery] remaps, [guard-feedback] escalations, validation errors, spiral warnings) while diagnosing a tool-call miss. SAME bearer + allowlist as the restart/diagnose path (only a service on HEARTH_OPS_RESTART_ALLOWED is readable); fail-safe when the relay is unwired. Cannot restart or change anything. Beatrice only — operational diagnosis.
read_market_data: read live stock-market data via keyless Yahoo Finance endpoints — delayed quotes, OHLCV history, per-ticker technical snapshots (returns/SMA/RSI/volume surge/volatility/drawdown), trending + day-gainer movers, and the theme-universe momentum screen over config/market-themes.yaml (market_quote, market_history, technical_snapshot, market_movers, momentum_screen, list_market_themes tools). Read-only, pure-math analysis — measures what IS moving, never predicts. Vivian only; backs both her analysis lane and the owner-opted-in speculative radar (vivian.yaml persona holds the honesty discipline). Holding this also serves the specialist's Market Radar office tab (GET /api/specialists/:id/market_radar).
write_market_radar: write the Market Radar snapshot (market_radar_snapshots table) — the refresh_market_radar background job screens every config/market-themes.yaml universe plus the trending feed via momentum_screen and persists the top names per theme for the fuel office's Market Radar tab and Vivian's brief radar line. Internal write, no external effect. Vivian only.
read_occupancy: read the derived "who's home & where" household-occupancy view — each enrolled person's most-recent camera sighting (zone + appearance + when) joined with their iOS home/away, plus active unrecognized people (household_occupancy tool + the Watch Desk's "Who's home" office tab). Household Awareness Layer P1; owner-only and the tool hard-checks owner tier on top of this grant. Derived security data outside the cordon — never enters RAG/search/cross-specialist sharing. Cassandra and Kate only (Kate added 2026-07-15, the security fold).
read_home: read the household-shared "who is where" occupancy map — Luna's Home office + the /api/specialists/luna/home_* routes. HOUSEHOLD-readable (mutual transparency; friend tier excluded), the NAMED map only — names + rooms + home/away. Unknowns, camera crops, and the away-monitor stay owner-only on Cassandra (read_occupancy). Household Awareness Layer P1.5; gates the household occupancy read + the owner-only camera/BLE assignment overlay. Luna only.
read_flights: read live flight status — status, gate, terminal, scheduled vs estimated times, delay, and baggage belt for a specific flight (flight_status), plus the caller's active live-tracking watch-list (list_tracked_flights). Backed by AeroDataBox (outbound poll only; no inbound webhook). On an unknown flight the tools return candidates (what to check), never a fabricated time/gate. Grant to any specialist that should answer "is my flight on time?" — today Kate (Iris later, for pickup timing).
track_flights: open or close a LIVE flight watch (track_flight / untrack_flight) — adds a flight to the per-user watch-list the FlightTrackingDriver polls on an adaptive cadence and pushes the moment it is delayed / departs / lands / changes gate / assigns a baggage belt. Internal write, no external SEND. Each watch is stamped private_to the watcher (the driver pushes to that user; the owner has no god-view). Kate holds it for chat + the Friends tab.
write_user_profile: record the CURRENT user's per-user profile + facets during Kate-led onboarding and ongoing learning (update_user_profile tool) — set which facets are theirs (ev/pets/garden/finance/…), write a private narrative note, seed other specialists about them, and mark onboarding complete. Writes are stamped private_to the user (the owner has no god-view). Kate only — she orchestrates onboarding; the facets she sets are what make each user's brief/persona reflect THEM.
message_user: message a USER you serve directly (message_user tool) — the message lands in their chat thread with you, pushes to their phone (quiet-hours gated), and they can reply back to you. The cordon is the safety — you may only message a user whose roster (allowed_specialists) includes you, so Linda can reach Kim but Kate (whom Kim doesn't roster) is told to relay through Linda; meta-agents are on no user's roster and so reach no one. Distinct from draft_message (an OWNER-reviewed external message) and present_questions (a tappable form to the conversation's user). Grant to any specialist that needs to reach the people it serves.
maintain_user_model: run the unified per-user model's off-peak synthesis tick (sweep_user_models background job) — walk the active roster × the facet taxonomy (style/interests/routines/…) and re-distill ONLY the facets that crossed their new-observation threshold, on a cheap tier, refine-not-rebuild. Internal write, no external effect; the afferent observers feed observations all day, this distills them at night so the resolver has fresh facets to inject. Each facet is read/written under its own user_id (the owner has no god-view). Kate only — she orchestrates the household model; the job is off her LLM surfaces.
read_mail: read the triaged Post Office — the per-account inbox stream bucketed by authenticity + importance (replies to threads you sent, real new mail, FYI subscriptions, filtered junk), individual messages, and threads (mail_list, mail_thread, mail_search tools). Reads the mail_messages projection only — never the live IMAP socket or stored credentials. Cordoned — each message carries private_to and the route + tools filter via note_visible_to_caller (the owner has no god-view of a household member's inbox). Also gates the Post Office office tab (GET /api/specialists/:id/postoffice). Generic — any specialist granted it serves a Post Office; today Kate.
ingest_mail: pull + triage mail on demand from the configured accounts into the mail_messages projection (mail_sync tool) — the manual counterpart to the always-on IMAP IDLE push driver. Reads the live mailbox and writes the triaged projection; no external SEND (that is send_email, dispatch-only + approval-gated). Kate holds it for the Post Office; the background driver does the same work continuously.
monitor_household_goods: scan the Household Knowledge Graph's purchased goods for closing return windows / expiring warranties and, on the edge (once per good+kind), file a followup action_proposal so Kate offers to act (start a return / file the warranty) — gated by the owner's tap, accruing Trust-Ladder XP when decided (scan_good_followups background job). Reads the household_goods projection (cordoned — each proposal is scoped to its good's own visibility; the owner has no god-view of a member's personal good) + files proposals. Background job, off the LLM surfaces; DARK until HEARTH_HOUSEHOLD_GRAPH=1. Kate only — she keeps the household's running goods picture.
read_weather_station: read the on-property WeatherFlow Tempest weather station's current conditions via Home Assistant (tempest_conditions tool) — ACTUAL ground-truth temp/humidity/pressure, wind speed+dir+gust+lull, rain rate + today's accumulation, UV/solar/illuminance, and lightning strike count + distance + recency, each with HA's own unit, plus a raining / lightning-recent safety digest. Distinct from read_weather (the geocoded Pirate forecast) and least-privilege vs read_home_assistant (this gates ONE weather tool, not raw HA entity access). Grant to any specialist that acts on real outdoor conditions — today Kate (brief), Eleanor (irrigation), Cassandra (lightning safety), Iris (departure).
read_air_quality: read the household's INDOOR air quality from the AirThings monitors via Home Assistant (airthings_conditions tool) — per-room radon (Bq/m³), CO₂ (ppm), VOC/TVOC (ppb), particulates PM1+PM2.5 (µg/m³), humidity, temperature, each with HA's own unit, plus a `signals.worst` digest naming the worst room per pollutant. Least-privilege vs read_home_assistant (gates ONE air-quality tool, not raw HA entity access); the indoor complement of read_weather_station. Grant to a specialist that answers indoor-air questions / acts on ventilation — today Iris (the HA-oriented owner). Proactive indoor-air alerting is the deterministic IndoorAirQualityDriver, not a capability.
attribute_events: record whose a generically-labeled shared-calendar event is (set_event_owner tool) — the LEARN half of calendar owner attribution. When the owner tells Kate (or answers her ask) the owner of an ambiguous joint-calendar event, she stores it against the event's fingerprint (title+location+weekday+hour) so future occurrences self-attribute via the fusion engine (calendar/organizer/location/learned signals). Internal write to the event_attributions store; household-shared knowledge (answers "who," not "what they did"). Kate only — she orchestrates the household calendar.
monitor_calendar_followups: scan the Calendar Knowledge Graph (life_events + People birthdays) for upcoming birthdays (→ a gift drawn from tracked likes within a LEARNED per-person budget), vacations (→ flight details + a welcome-back reminder), and appointments (→ address + drive-time prep) and, on the edge (once per event), file a followup action_proposal so Kate offers to act — gated by the owner's tap, accruing Trust-Ladder XP when decided (scan_calendar_followups background job). Reads life_events + People (cordoned — each proposal is scoped to its event's own visibility; the owner has no god-view of a member's personal event) + files proposals. Background job, off the LLM surfaces; DARK until HEARTH_CALENDAR_TRIGGERS=1. Kate only — she keeps the household's running calendar picture.
monitor_cross_signals: scan upcoming calendar signals for COINCIDENCES a single-domain scan misses — a visitor (named in an upcoming visit/trip event) whose birthday/anniversary lands inside the visit window (→ offer a gift from tracked likes within a learned budget + a plan), and two of the owner's events whose times overlap (→ a heads-up) — and, on the edge (once per coincidence), file a nudge action_proposal so Kate offers to act, gated by the owner's tap and accruing Trust-Ladder XP when decided (scan_cross_signals background job). Reads life_events + People + knowledge edges; files proposals each cordon-scoped to its signal's owner (the owner has no god-view of a member's personal event). Background job, off the LLM surfaces; DARK until HEARTH_CROSS_SIGNAL=1. Kate only — she keeps the household's running calendar picture.
monitor_life_events: scan the relationship life-event observation stream (person_observations of kind 'life_event' — a friend's trip, a new job, an engagement, a move, a loss — distilled from chat mentions + the iMessage observer) for a NEW, ACTIONABLE milestone and, on the edge (once per life event), file a proactive action_proposal so Kate OFFERS to help (wish them well / congratulate / check their flights / a thoughtful check-in / update the record) — gated by the owner's tap, accruing Trust-Ladder XP when decided (scan_life_events background job). Two gates — a deterministic RECENCY window plus the model's ACTIONABILITY judgment (fail-CLOSED, so a proactive surface skips on an LLM outage rather than offering on noise). The relationship-signal sibling of monitor_calendar_followups (which fires on PROJECTED calendar life_event notes); different source, no overlap. Reads person_observations + People; files proposals each cordon-scoped to its observation's owner (the owner has no god-view of a member's). Background job, off the LLM surfaces; DARK until HEARTH_LIFE_EVENT_OFFERS=1. Kate only — she keeps the household's relationship picture.
monitor_meeting_prep: scan upcoming calendar meetings for ones that NAME a person in the contact graph and, on the edge (once per person+meeting), file a "before you see them" briefing — what's OPEN with them (open-loop observations), what's worth BRINGING UP (the synthesis narrative + recent life events), and whether you're OVERDUE to connect (cadence vs last_contacted). High-recall first-name matching finds candidates; a cheap LLM gate then decides which name-matched events are real meetings WITH the person (so "Sam Payday" — a name match, not a meeting — is gated out), and the heads-up is assembled purely from knowledge the system already produced (the gate is the model's judgment per LAW#1; the assembly fabricates nothing). The relationship counterpart of monitor_calendar_followups (which fires on the calendar's OWN concerns); this fires when an event names someone you know. A briefing is an FYI heads-up that self-expires, so a prep for a past meeting doesn't linger; the actionable items keep their own action_proposals. Reads upcoming life_events + People + the owner-private observations/synthesis through the viewer's cordon; files proposals cordon-scoped to the meeting's owner. Background job, off the LLM surfaces; DARK until HEARTH_MEETING_PREP=1. Kate only — she keeps the household's relationship picture.
test_emergency_alert: run an on-demand DRILL of the household emergency-alert system (test_emergency_alert tool) — fires a clearly-labeled "this is only a test" through BOTH channels at once — the Satellite1 (alert tone + spoken test, presence-gated) AND a high-severity push to the household's phones, the same live path a real lightning/tornado/flood alert uses. The MANUAL counterpart to the autonomous DangerousWeatherDriver; the owner triggers it by asking Kate (voice or chat). Owner/household-gated (friends + synthetic/test accounts never receive it). Kate only — she's the voice ambassador for the household alert system.
announce_on_device: speak an arbitrary message aloud on the household Satellite1 / house speaker on demand (announce_on_device tool) — the free-text sibling of test_emergency_alert; presence-gated by the device, speaker-only (it never pushes), and unable to fire the emergency alarm tone. Owner/household-gated. Kate only — she's the household's spoken voice.
delegate_subagents: hand a task to another specialist as a SUB-AGENT (delegate tool) — the delegatee runs a FULL turn in its OWN disposable context (own tool rounds, own token budget, own inference slot) and only a bounded digest returns, so the requester's context never pays for the delegatee's tool exhaust. quick mode waits ~90s then degrades to background; background reports back via a specialist-inbox FYI. The structural upgrade over consult_specialist (which blocks the requester's turn synchronously); the Semaphore-bounded DelegationRunner (HEARTH_DELEGATE_MAX_CONCURRENCY) keeps a delegation burst from starving the shared 35B slots. Kate only today — she is the chief of staff the sub-agent roster reports to (docs/design-kate-subagents.md).
monitor_household_services: keep the household's Services & Bills ledger — the standing vendor relationships (waste/recycling, utilities, insurance, telecom, subscriptions, memberships) LEARNED from the mail exhaust. Gates the weekly learn_household_services background job (deterministic recurring-sender clustering over mail_messages feeds ONE deep-tier classification call; the MODEL decides what is a service, the code stores it as household_service notes keyed on the vendor anchor — idempotent refresh, never duplicates) AND the household_services chat read ("do we have trash service?", "lay out my bills" — matched services + upcoming due estimates + a monthly-equivalent total). Also gates the daily scan_expected_bills probe (Phase C anticipation — pure cadence math over the ledger files once-only advisory proposals for expected-but-missing bills and gone-quiet services; DARK until HEARTH_BILL_ANTICIPATION=1). The projected ledger also grounds mail triage (a bill from a vendor the household actually HAS reads transactional, not junk) and the working-memory "Bills & services" section. Read + internal-write only — it never sends or spends; the permission floor is untouched. Background learner DARK until HEARTH_HOUSEHOLD_SERVICES=1. Kate only — she is the executive assistant who knows the household's standing facts.
index_precedent: the nightly precedent-case indexer (index_precedent_cases tool, job-only) — render the DECIDED history (decided proposals with their decide reasons, Proposal-Court verdicts with lens votes, closed/verified process misses with their resolution trails) into compact cases in the precedent_cases index, each carrying an explicit outcome-confidence weight (a reason-less denial is WEAK precedent), then back-fill embeddings when the RAG embedder is live (text-only rows still match via deterministic token overlap). Idempotent per source id; cordon inherited from the underlying proposal (the owner has no god-view of a member's cordoned case). Internal write only. Kate only — she keeps the household's case law; DARK until HEARTH_PRECEDENT=1.
recall_precedent: read household case law (recall_precedent tool) — how similar past proposals, court cases, and process misses were DECIDED (approved / denied / lapsed / resolved), each with its outcome-confidence weight, matched by embedding when the RAG tier is live and by deterministic token overlap otherwise. Precedent is EVIDENCE for the model's judgment, never a decision rule — a weak-confidence case settles nothing on its own. Cordon mirrors the proposals queue (owner sees system cases + his own; a member sees only their own; no user in context fails closed to system cases). Read-only. Kate only — chat + deliberation; DARK until HEARTH_PRECEDENT=1.
write_household_services: told-first writes to the household Services & Bills ledger (manage_household_services tool) — add/update/deactivate/remove a vendor entry the SAME TURN the user states a service fact ("CityFiber is $100/mo", "cancel Twitch", "Cox isn't ours"), plus a list read-back. Writes ride the mail-learner's exact note path (household_service PROJECTED notes, shared_entity → household cordon) with source 'manual' + confidence 1.0 — a told fact outranks any mail inference. The write half of the Phase-A ledger (learn_household_services is the mail-learning half; monitor_household_services the anticipation scan). Kate only — she keeps the household's standing facts.
reveal_self: SERVICE MODE self-introspection (owner-only) — gates the reveal_self tool, by which Kate reads her OWN live loaded config (persona, chat_style, chat/deliberation addenda, voice register, granted capabilities, resolved tool surface, model role + background jobs + reactive triggers, the raw kate.yaml, and the LIVE assembled system prompt she runs on) and exports a large part to an owner-private vault note. Owner-gated at the tool layer regardless of the grant; read-only — changes still route through Beatrice's review pipeline. Kate only — she is the one you talk to.
service_mode_infra: SERVICE MODE infra diagnostics (owner-only) — gates Kate's list_services / diagnose_service / restart_container tools, by which she reads the the LLM host Docker stack through the guarded ops-relay to answer "is Plex down / why / what's wrong with the server". Distinct from Beatrice's diagnose_infra (dependency-registry diagnosis); this is Kate's whole-stack owner-facing service mode. Reads (list / inspect / logs) are READ-ANY (bearer-only, low blast radius); restart is NARROW (the relay's HEARTH_OPS_RESTART_ALLOWED allowlist is the real gate, so she can only restart the sanctioned few). Owner-gated at the tool layer regardless of the grant. Kate only.
read_house_climate: read the house's fused thermal state + history via Home Assistant — the house_climate tool (thermostat setpoint / hvac_action / mode + per-zone temperatures with humidity + occupancy + the Tempest outdoor reference, with indoor-outdoor deltas and a warmest/coolest/occupied digest) and the house_thermal_history tool (HVAC runs with start/end/setpoint, duty-cycle + cycle counts, and per-zone heat-loss fits — Newton coefficient + time constant — from HVAC-idle drift vs the outdoor delta, over HA recorder history). Least-privilege vs read_home_assistant (two typed house reads, not raw entity access); the whole-house sibling of read_air_quality / read_weather_station. Grant to the specialist that runs the house — today Kate (house-fusion Phase 1, 2026-07-13).
read_house_energy: read the household's energy picture from the Tesla energy site (Teslemetry via Home Assistant) — the house_energy tool. Live solar / home-load / grid power flows (import vs export), today's kWh counters (generated, imported, exported, home usage), derived self-consumption + self-sufficiency fractions, and honest battery reporting (this site has no Powerwall — battery fields read absent, never fabricated). Least-privilege vs read_home_assistant (one typed energy read). Grant to the specialist that runs the house — today Kate (house-fusion Phase 1, 2026-07-13).
manage_media_archive: archive a URL to the Serapeum media store — the archive_url tool files a media_archive_jobs row + kicks a detached MediaArchiveRunner (probe → NSFW classify → categorize → compat download via MeTube/gallery-dl → context .md → media_items index → cordon → report-back). Also gates the /api/media/* serving surface conceptually (browse/search/stream). Read + internal-write only; NSFW/uncertain items cordon owner-only (fail-closed). Kate only — she fronts the archive surface; the detached runner does the work.
manage_host_power: power household machines on and off on the owner's request (owner-only) — gates Kate's wake_host / sleep_host / list_power_hosts tools. Waking sends a Wake-on-LAN magic packet through the host-network relay that browse_url already uses; sleeping goes through the target's own agentd POST /suspend, so the two guards that matter (never suspend an always-on host, never suspend mid-session) are enforced ON THE TARGET and cannot be bypassed from the caller side. Allowlisted to the machines in config/power_hosts.yaml — there is no any-host path. Exists because a box woken by WoL without a wake marker never auto-sleeps and otherwise sits idle burning power. Owner-gated at the tool layer regardless of the grant. Kate only.
read_capability_demand: read the clustered tool-surface miss ledger (read_capability_demand tool) — which tools the team reached for and could not use (forbidden calls, unknown tool names, load_tools catalog misses), with recurrence counts, first/last seen. The runtime records every miss content-free (tool + capability + specialist + surface, never message text — cordon-safe); this is the redesigned live demand signal that replaced the disabled drive_roster_gaps miner. A recurring real gap becomes a file_build_request spec; a forbidden miss on a tool a teammate already owns is a grant/surfacing question for Beatrice; one-off noise is ignored. Read-only. Kate only — she runs the team and commissions the builds.
critique_code_change: read ONE Beatrice change record in full — embedded diff, rationale, files touched, code metrics, and the deterministic check results — for adversarial critique (read_change_for_critique tool). Deliberately verdict-free and read-only — the holder cannot move a change's status, file a proposal, or write anything; findings (blocker/concern/nit with file+line anchors) return as a delegation digest. Vera (the code-critic subagent) only — Kate delegates a bchg_* id to her and weighs the critique before ruling via review_change; the owner still merges.
generate_image: create a real image with the house Krea 2 Turbo model (generate_image tool) — runs on the forza DGX Spark's GPU ComfyUI (HEARTH_IMAGEGEN_COMFYUI_URL), ~10-30s per image. The specialist describes the scene in visual language (optionally depicting THEMSELF via depict_self, which anchors on the canonical `appearance` descriptor in their YAML so self-portraits stay on-model with their avatar), the PNG lands under the vault's _attachments/generated dir, and the tool returns a markdown image line the specialist places VERBATIM in its reply or a message_user body — it renders natively in web and iOS chat (served authenticated at /api/media/generated). Internal write only, no external send — the image reaches only the conversation it is written into. Grant to user-facing staff who should be able to show rather than tell — today Kate, Astrid, Ruby, Vivian, Kristi, Linda, Mariah.
read_court_records: search real court records by party name via CourtListener/RECAP (courtlistener_search tool) — federal district, appellate and bankruptcy dockets plus a published-opinion corpus that includes state appellate courts. Free and keyless; COURTLISTENER_API_TOKEN only raises the rate limit. This is the records-tier answer to "has this person been in court", and it exists because an open-web search for the words "court records" returns SEO farms rather than records — the live Daniel Torres investigation read eighteen such pages and found nothing, while this API returns real dockets with case numbers and filing dates for the same name. Every result carries a coverage_note stating what RECAP does NOT hold (county-level divorce, protective orders, civil judgments, liens and property), so an empty federal result can never be read as "no court history". Read-only. Kate and Ruby — the two deep_research fronts.
learn_skills: Tier-1 procedural memory (learn_skill / recall_skill tools) — write down a multi-step procedure worked out the long way, and read it back next time instead of re-deriving it. A skill is a DOCUMENT, never a program — the runtime renders it into the prompt and the specialist still makes every tool call itself, through the ordinary gated dispatch (same capability check, same risk tier, same audit row, same owner tap). It therefore confers NO new reach — learn_skill validates every step against the tool grants the specialist already holds and refuses the write otherwise, and recall_skill re-checks at read time so a revoked grant degrades the procedure instead of quietly outliving itself. Its own capability rather than folded into write_vault because a skill is read back INTO THE PROMPT — granting this is granting a specialist the ability to write its own standing instructions, which should be visible in the YAML. New skills are born provisional and earn their place (3 reported successes) or retire themselves (2 dismissals). Kill switch HEARTH_SKILLS=0. Kate first — the soak rides on her before it widens.
ha_automation_read: read Home Assistant AUTOMATION configs — trigger/condition/action definitions like the lightning-alert mile-range thresholds — via ha_get_automation (list mode from /api/states, single mode from /api/config/automation/config/<id>). Read-only, and deliberately NARROWER than read_home_assistant — it exposes the automation layer only, not whole-house entity state — so Kate can hold it without reversing the 2026-06-07 "Kate reads no HA directly" decision. Shipped from approved binding proposal 01KY5SZ3BQNKCS0Y4XZ6VT6BTZ (original grantee Cassandra; the 2026-07-15 security fold moved the perimeter — and this grant — to Kate).
read_process_miss: read ONE process-miss record's full stored fields by id (read_miss tool) — status, subject specialist, task summary, gap, severity, evidence_ref, notes, timestamps. Read-only audit affordance closing the opaque-closed-miss gap (approved proposal 01KYZ5803HQPW1ZS70P8RGDBFF; PRs #268/#269). Distinct from write_process_miss (filing) and drive_process_misses (ledger lifecycle) — this is the READ leg those two always lacked. Kate, Mariah, and the trainer ledger hold it.
read_proposals: read ONE proposal record in FULL by id (read_proposal_by_id tool) — payload, rationale, status, decision/execution timestamps, execution result, any status including terminal (approved/acknowledged/executed). Closes the 2026-08-11 directed-build execution blocker — read_my_proposals scopes to the caller's own open rows and audit previews truncate, so the specialist implementing an APPROVED proposal could not read back what was approved and stock builds burned rounds hunting then blanked. Owner-global rows (user_id NULL) readable by any holder; user-cordoned rows only by their author. Read-only. Kate and the trainer build/ledger agents hold it.
