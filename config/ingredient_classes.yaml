# config/ingredient_classes.yaml — coarse refrigerator-life classes for
# ingredient freshness, used by Brigid when sequencing a week of dinners
# so the most volatile proteins/produce land early in the week.
#
# Five classes by approximate fridge life. Class 1 = use within ~2 days;
# Class 5 = pantry / months. Class numbers map to the day-of-week target
# in Brigid's plan logic:
#   class 1 → Mon/Tue
#   class 2 → Mon-Wed
#   class 3 → Mon-Fri (any weeknight)
#   class 4 → any day, including weekend
#   class 5 → no constraint
#
# The list isn't exhaustive — it's a useful prior. When an ingredient
# isn't here, Brigid asks the LLM ("which class is `harissa paste`?")
# and falls back to class 5 if no judgment is available. Add entries as
# you notice them — chokidar reloads the file with no restart.

class_1:
  description: "Highly volatile — fish, shellfish, soft leafy greens. Use within ~2 days."
  ingredients:
    - "salmon"
    - "tuna"
    - "cod"
    - "halibut"
    - "trout"
    - "sea bass"
    - "tilapia"
    - "white fish"
    - "shrimp"
    - "scallops"
    - "mussels"
    - "clams"
    - "oysters"
    - "arugula"
    - "spring mix"
    - "baby spinach"
    - "watercress"
    - "fresh basil"
    - "fresh cilantro"
    - "fresh dill"

