  manage_host_power: true
  # Staffing oversight (2026-06-10): surfaces the roster-gap report
  # (unclaimed-domain evidence mined from Cordelia's triage interrupts +
  # unattributed knowledge demand) in her deliberation pass, with
  # instructions to convert clusters that clear the evidence bar into
  # propose_hire packets. Kate-only — she runs the team.
  # drive_roster_gaps: true   # DISABLED 2026-06-20 (Jasper): roster-gap->propose_hire
