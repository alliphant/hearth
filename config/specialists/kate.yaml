  # misattributed to orchestrator as "unclaimed domains", re-filing every pass. OFF
  # until the staffing-signal source is redesigned. Re-enable = uncomment this line.
  read_friday_system: true
  read_finance_signals: true
  # ── Vivian + Astrid fold-in (2026-08-02, owner-directed) ──────────────
