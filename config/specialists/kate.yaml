  # she still makes each call herself through the normal gate. Born
  # provisional; earns its place or retires itself. Kate first — this is
  # the soak, and she is the surface with enough repeated multi-step work
  # for the ladder to actually move. See docs/design-hearth-self-evolution.md.
  learn_skills: true
proactive:
  mode: active
  awareness_hz: 0.0167
  deliberation_at:
    - "00:00"
    - "07:00"
    - "12:30"
    - "18:00"
    - "22:00"
  # 00:00 is the MIDNIGHT PERIMETER PASS (inherited 2026-07-26 when the
  # security persona dissolved). It is not a brief slot — no brief is
  # written at midnight. See the "Midnight perimeter pass" section in the
  # persona for what the slot actually does.
  interrupt_threshold: high
  # Kate wakes off-schedule when a peer flags her, so triage doesn't
  # wait for her next scheduled slot. 30s debounce in LoopDriver.
  wake_on_flag: true
  # The capture pipeline routes paper mail + business cards (and any
  # below-threshold capture) here; two intake handlers under
  # src/specialists/kate/intake/ split the work.
  intake_captures: true
  # Working memory (2026-07-01): every chat turn + deliberation pass carries
  # the fused household pulse — mail needing you, live people signals,
  # upcoming life events, purchase follow-ups, pending decisions — composed
  # per-caller (cordoned) from the stores the signal pipelines already fill.
  # DARK behind HEARTH_WORKING_MEMORY=1; see src/core/working_memory.ts.
  situational_context: true
  # Background jobs fire on the same 60-second cron as deliberation,
  # invoked through the tool registry and audited as `background_job`.
  # `at` accepts HH:MM (daily) or `*:MM` (hourly at that minute).
  background_jobs:
    # Nightly at 05:30 — the walk-the-house reflection (C2 self-direction
    # spine): ONE open-mandate deep-tier pass over working memory + her own
    # watch ledger, after the 03:30-04:15 sweeps fill the stores and before
    # the 07:00 brief so open watches feed its watching section. Kill switch
    # HEARTH_KATE_REFLECTION (the act rung further behind
    # HEARTH_KATE_REFLECTION_ACT — watch-only soak first); manual catch-up via
    # fire_background_job?name=household_reflection.
    - name: household_reflection
      at: "05:30"
      tool: reflect_household
    # Nightly at 05:10 — the house ledger (house-fusion Phase 3, 2026-07-13).
    # Distills YESTERDAY into one dated Knowledge/Luna/house-log.md entry
    # (outdoor context incl. wind + irradiance, HVAC duty/cycles/setpoints,
    # per-zone heat-loss fits, energy day + yield index) so baselines outlive
    # the recorder's ~10 days. Idempotent per date; before the 05:30
    # reflection + 07:00 brief so the Monday envelope-trend pass can diff it.
    # Manual catch-up / backfill via fire_background_job?name=house_ledger.
    - name: house_ledger
      at: "05:10"
      tool: distill_house_day
    # Hourly: pull recent user messages and append fresh stylistic
    # observations to Knowledge/Kate/jasper_style.md (bullets are the
    # raw audit trail).
    - name: observe_style
      at: "*:15"
      tool: observe_jasper_voice
    # Daily at 3 AM: rebuild Knowledge/Kate/jasper_style_profile.md
    # from the accumulated bullets + the corpus.
    - name: distill_style
      at: "03:00"
      tool: distill_jasper_style
    # Daily at 04:10 — after Cordelia's 03:40 source refresh fills
    # news_items: compose Kate's Read (lead + per-category takes,
    # citation-verified, evolving) for the News Desk tab + a daily
    # library note so chat answers ground in the same views. Kill
    # switch HEARTH_NEWS_TAKES=0. NOT on her LLM tool surfaces — the
    # job is the trigger; manual catch-up via fire_background_job.
    - name: compose_kates_read
      at: "04:10"
      tool: compose_news_takes
    # Nightly: advance any deep-research investigations the detached kick
    # couldn't finish (crash recovery / browser-deferred fetches). The tool
    # is off her LLM surfaces — the job is the trigger; manual catch-up via
    # fire_background_job?name=research_investigation_sweep.
    - name: research_investigation_sweep
      at: "03:25"
      tool: advance_research_investigations
    # Hourly dependency health sweep: probe + audit-log error-rate over every
    # external dependency, drive the incident ledger, and on a new degraded/down
    # edge file a miss for Beatrice + flag her + push Jasper. Catches a silent
    # outage within the hour (the 8-day Firecrawl gap). Kill switch
    # HEARTH_SYSTEM_HEALTH=0; manual fire via fire_background_job?name=system_health_scan.
    - name: system_health_scan
      at: "*:10"
      tool: scan_system_health
    # Daily at 05:10 — capability-yield sweep. Deliberately DAILY, not hourly:
    # a yield verdict is a property of a RUN SERIES, so scanning more often
    # than the jobs themselves run just re-reads the same rows. 05:10 sits
    # after the 03:00-04:50 nightly sweeps have written their runs and before
    # the 05:30 reflection pass, so the day's evidence is complete. Kill switch
    # HEARTH_CAPABILITY_YIELD=0; manual fire via
    # fire_background_job?name=capability_yield_scan.
    - name: capability_yield_scan
      at: "05:10"
      tool: scan_capability_yield
    # Daily at 05:15 — score every automated change that hasn't been measured
    # against the golden suite (same-task before/after delta, never an absolute
    # pass rate; the suite runs a standing ~110/151 mix). AFTER the nightly eval
    # run has written its results, so "after" is fresh. A clean regression files
    # a miss + wakes Beatrice + names the one call that undoes it; it only
    # auto-reverts when HEARTH_AUTO_REVERT=1, which is deliberately off — it
    # flags before it reverts, like HEARTH_RESEARCH_VERIFY_DROP.
    - name: change_window_review
