id: kate
name: Kate
role: Chief of Staff
# Build-agent passes (directed builds) burn most of the default 15 rounds on
# the mandatory verify-first research and blank out before authoring the PR —
# all three 2026-08-10 directed builds died at exactly 15/15. Same capacity
# class as trainer's bump; 20 is the schema ceiling.
max_tool_rounds: 20
avatar: Knowledge/Kate/avatar.png
# Canonical on-camera description — generate_image prepends this on
# depict_self so her self-portraits match the avatar the household knows.
appearance: >
  A late-30s woman with rich auburn-chestnut hair in a softly polished low
  bun, a few escaped strands framing her face, warm hazel eyes, strong
  cheekbones, and a steady, knowing half-smile. Signature look — a tailored
  charcoal-grey blazer over a deep ivory silk blouse, a single thin gold
  chain at her throat.
voice: warm-direct
aliases: [ "cos", "chief-of-staff" ]
default_landing: true
# Kate's office is the warm "briefing" room (compose_briefing_pane in
# src/core/specialist_pane.ts): her latest brief embedded in-room, the
# team-health glance (escalations-to-Kate + Mariah's stuck-work ledger +
# brief cadence/mood), and — Phase 2 — the "needs you" recommendation
# cards she files for concerns she couldn't settle herself. Team-ops
# blocks are owner-gated; a friend-tier household member sees only the brief.
pane_kind: briefing
# Think-OFF chat (2026-05-31, reverted from specialist_thinking). An A/B on
# grounding-sensitive prompts found think-off strictly better for interactive
# chat — identical accuracy, no new fabrication, 3-7x faster, ~10x fewer
# tokens. Faithfulness comes from the grounding block + fact_critic, not the
# think channel; hard multi-step synthesis still escalates via
# consult_deep_model (think-ON deep tier). Evidence: THINK_OFF_CHAT_BRIEF.md.
llm_role: specialist

# Recognise a hard-shaped ask on a SINGLE complexity signal, not the default 2
# (see complexity.ts). Kate is the chief-of-staff: her hard turns are often
# SHORT operational/reasoning asks ("Why does Kristi own hire packets?", "Is
# this redundant with X?", "is this a hire or a tool?") that the default gate
# left on the fast tier — which fabricated through them (the 2026-06-16
# Kristi-scope spiral). Trivial chat (zero signals — "hey", "weather?") is
# never recognised at any floor.
#
# ⚠ 2026-08-05, TWICE — READ BOTH BEFORE TOUCHING THIS.
#
# (1) This block used to say floor 1 "routes those to the 35B". That was true
#     when written and is not now: `deep_consult` moved to the 122B on forza
#     (think-ON, concurrency 2, 300s timeout).
# (2) A floor no longer ROUTES ANYTHING. escalate-on-evidence (escalation.ts)
#     replaced prediction with demonstration, and `assess_complexity` now only
#     routes a turn up front when the USER EXPLICITLY ASKS for depth. The floor
#     survives as the sensitivity of the INSTRUMENT — it decides
#     `would_have_escalated`, which every turn now records so the predictor can
#     be graded against what the turn went on to demonstrate.
#
# So: lowering another specialist's floor is now a cheap, safe thing to do (it
# buys observability, not latency), and RAISING Kate's would blind the
# comparison for the specialist with the most turns. Set it for what you want
# to measure. HEARTH_COMPLEXITY_GATE=predict makes floors route again.
complexity_floor: 1

knowledge_scope:
  - "**"

capabilities:
  read_vault: true
  # Calendar is now sourced from the iOS calendar snapshot (POST
  # /api/sensors/calendar) — aggregates iCloud + Google + Exchange via
  # EventKit, replaces the deprecated HA-CalDAV path. Tools are
  # sensor_calendar_upcoming / sensor_in_meeting / sensor_free_blocks.
  read_calendar: true
  # Pirate Weather (https://pirateweather.net). Free tier, DarkSky-shape
  # JSON. Connector calls cache 5 min per (lat, lng). Requires
  # PIRATE_WEATHER_API_KEY + HEARTH_HOME_LAT + HEARTH_HOME_LON env vars
  # on the orchestrator host. Tools are weather_now / weather_forecast
  # / weather_alerts.
  read_weather: true
  # On-property WeatherFlow Tempest (2026-06-23) — ACTUAL station readings
  # via Home Assistant (tempest_conditions), distinct from the geocoded
  # Pirate forecast above. Kate's brief leads with the real outdoor line.
  read_weather_station: true
  # Emergency-alert drill (2026-06-24) — on-demand test of the household
  # emergency broadcast: fires the tone + spoken test on the Satellite1 AND a
  # household push, both at once (test_emergency_alert tool).
  test_emergency_alert: true
  # Announce-on-device (2026-07-21) — speak an arbitrary sentence aloud on the
  # Satellite1 on command ("say hi to Kyle on the speaker"). Free-text sibling of
  # the drill above; presence-gated, speaker-only, and it can't fire the alarm tone.
  announce_on_device: true
  # Live flight tracking (2026-06-21) — AeroDataBox.
  read_flights: true
  track_flights: true
  # Kate's Read (2026-06-10) — her citation-verified takes over the News
  # Desk (the compose_news_takes 04:10 background job below). The tool
  # drops any take whose headline citations don't resolve.
  write_news_takes: true
  # Brief-time read of the desk's raw overnight headlines (query_news_items),
  # so the 07:00 brief opens with real news, cited by source domain.
  read_news: true
  # read_home_assistant removed 2026-06-07 — Kate reads no HA directly.
  # Smart-home / device state belongs to the specialist who OWNS it
  # (garden, kitchen, property), reached via consult_specialist. The
  # perimeter is the exception — that folded INTO Kate on 2026-07-15
  # (read_unifi / read_occupancy below).
  # read_miss (2026-08-10): audit closed process misses without DB access
  # (PR #269 shipped this as a comment only; the real grant landed in the
  # owner fixup, 2026-08-11.)
  read_process_miss: true
  # read_proposal_by_id (2026-08-11): read any owner-global proposal in full
  # by id, terminal rows included — skeptic review + dispatch oversight needs
  # the record the approval flag names, not a truncated preview.
  read_proposals: true
  # As the household grows the per-user superpower is
  # the iOS app, not the admin's single Home Assistant box.
  read_audit_log: true
  # Owner-oversight: lets the owner ask Kate "what has <user> been up to."
  # Gates the review_user_activity tool — the one audited path across the
  # per-user cordon. Owner-only at the tool layer regardless of this grant.
  owner_oversight: true
  # Skeptic review of Beatrice's self-modification changes (the Code Shop gate).
  # Gates list_changes_for_review + review_change. Kate-only; her approval is the
  # required pre-gate before a change reaches the owner's merge approval.
  review_beatrice_change: true
  # ── Beatrice dissolution, phase 1 (2026-07-21): Kate authors directly ──
  # Dissolving Beatrice (id 'trainer', already subagent_only) INTO Kate — a Kate
  # conversation/deliberation becomes the build intake. These grants make Kate the
  # AUTHOR of code changes (previously trainer-only). She already holds
  # review_beatrice_change (above), so she now commissions AND reviews — SAFETY is
  # unchanged and AUTHOR-AGNOSTIC: every authored change still runs checks → an
  # independent Vera ('critic') critique → the owner's merge tap, and any change
  # touching a PROTECTED_CODE_PATH (incl. config/specialists/, config/capabilities.yaml)
  # can NEVER auto-merge (is_protected_code_change is path-keyed, not author-keyed —
  # verified review_change.ts:257-286 + code_teeth.ts:88). 'trainer' stays alive as
  # the internal build/court/ledger anchor; this is a grant, not a persona deletion.
  read_codebase: true          # read her own design: grep_codebase/list_codebase/read_codebase_file/repo_map
  write_codebase_pr: true      # author: propose_code_change/_edit, opencode_build, scaffold_code, workbench_*
  manage_scrum: true           # own the dev-board: scrum_* (grooming + sprints + retros)
  write_process_miss: true     # file coverage/accountability misses
  drive_process_misses: true   # drive the open-miss ledger forward
  write_vault_trainer: true    # write Knowledge/Trainer/** (build-requests, standup-log) under her own hand
  # Read-only self-diagnosis of her OWN runtime (awareness domain 2) — these file
  # owner recommendations, they never apply a fix (reads/recommendations, not effects):
  diagnose_infra: true         # diagnose a down dependency on the LOCAL deep model, file a recommendation
  diagnose_toolcalls: true     # diagnose a recurring tool-arg / guard failure, file a recommendation
  read_service_logs: true      # read allowlisted container logs (read-only)
  # ── Cordelia consolidation, phase 3 (2026-07-21): Kate owns the capture surface ──
  # The librarian DESK is dissolved (cordelia.yaml subagent_only) and capture flags
  # now speak in Kate's voice, so she needs the read/vision + shelf-write tools the
  # capture pipeline uses. All three are composition/awareness, not effects: two are
  # pure reads over an image the user already handed us, and the third writes only
  # into the library shelves. The deterministic pipeline (VL, OCR, EXIF, dedup,
  # thumbnails, RAG filing) is unchanged — this grants Kate the surface, not a rewrite.
  analyze_image: true          # VL describe over a capture (read)
  ocr_image: true              # OCR text extraction over a capture (read)
  write_vault_any_library: true # cross-shelf library write (save_library_item / ingest_to_library)
  # HELD for an explicit owner decision — these are EFFECTS, not composition, so they
  # route through the effect-gate rather than a bare grant (see the dissolution PR):
  #   * auto_apply_low_risk — self-edit that BYPASSES the proposal queue; verify it
  #     honors is_protected_code_change before Kate holds it.
  #   * remediate_infra — restart a container (side-effecting).
  #   * merge_codebase_pr — dispatch_only; deferred to phase 2 with the author-id /
  #     proposal_court re-seat (the merge card is filed under 'trainer' today).
  # Capability-demand ledger read (2026-07-14) — the clustered report of tools
  # the team reached for and could not use (forbidden / unknown_tool /
  # load_tools misses, recorded content-free by the runtime). Recurring real
  # gaps become file_build_request specs; grant-shaped misses go to Beatrice.
  # The redesigned live demand signal that replaced drive_roster_gaps.
  read_capability_demand: true
  # Host power (2026-07-28, owner request): wake a machine with Wake-on-LAN and
  # put it back to sleep. Allowlisted to config/power_hosts.yaml; the
  # never-sleep-an-always-on-host and never-sleep-mid-session refusals live on
