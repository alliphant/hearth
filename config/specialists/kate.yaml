    # back on the Satellite1 if he's present, else pushed). Without it a spoken
    # "I'll look into that" is just prose and the promise is dropped. (2026-06-15)
    - promise_followup
    # Web reach on voice (2026-07-08): explicitly listed so "search the web /
    # look that up" works even in the fail-open fallback surface (embeddings
    # down). In the normal dynamic path these also ride the catalog and act as
    # ranking priors, so a spoken "look that up" reliably surfaces web_search.
    - web_search
    - web_fetch_clean
    - browse_url
