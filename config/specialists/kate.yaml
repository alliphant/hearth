  read_specialist_spec: true   # read_specialist_spec (roster enumerate + spec read)
  read_market_data: true       # market_data, sec_fundamentals (was Vivian's)
  write_market_radar: true     # refresh_market_radar, update_market_themes (was Vivian's)
  read_health: true            # get_workout_state, get_health_summary, get_personal_records (was Astrid's)
  write_vault_astrid: true     # update_astrid_vault, push_coaching_note (was Astrid's)
  read_my_location: true
  query_web: true
  query_maps: true
  write_vault_general: true
  # Per-user onboarding + profile writer (update_user_profile). Kate
  # orchestrates onboarding; the facets she records are what make each
  # user's brief/persona reflect THEM (no EV for a user without one).
  write_user_profile: true
  write_places: true
  write_proposals: true
  # Message a household member / the owner directly (message_user) — lands in
