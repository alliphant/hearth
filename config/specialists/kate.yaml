    # fire_background_job?name=precedent_index.
    - name: precedent_index
      at: "04:50"
      tool: index_precedent_cases
    # Daily at 09:05 — the Case Driver tick (Incident→Immunity S1). Walks the
    # open process-miss ledger: stale cases → ONE directed wake at trainer
    # (diagnose + fix through her normal pipeline); dispatched-but-unverified
    # fixes → wake Mariah (verify_fix_landed re-runs the owning scan); still
    # stuck after the nudge budget → escalate ONCE to the owner. Durable
    # per-miss cooldown markers; meta-loop-safe. DARK until HEARTH_CASE_DRIVER=1;
    # manual catch-up via fire_background_job?name=drive_open_cases.
    - name: drive_open_cases
      at: "09:05"
      tool: drive_open_cases
    # Daily at 08:40 — the Proposal Court (the Council). Kate + Beatrice +
    # Mariah as different-lens skeptics over the aged pending queue: decide
    # internal kinds on consensus, lapse stale offers (no XP effect), one
    # consolidated owner digest for splits + floor-class items. DARK until
    # HEARTH_PROPOSAL_COURT=1; manual via fire_background_job?name=proposal_court.
    - name: proposal_court
      at: "08:40"
      tool: convene_proposal_court
    # Two more daily convenings (2026-07-05): with COURT_KINDS exempt from
    # the min-age grace, an internal enablement filed at any hour clears the
    # bench within ~6h instead of parking in the owner's queue overnight —
    # the "jerky start-stop" fix. The convening is idempotent over the
    # pending queue; an empty docket returns examined=0 for pennies.
    - name: proposal_court_afternoon
      at: "14:40"
      tool: convene_proposal_court
    - name: proposal_court_evening
      at: "20:40"
      tool: convene_proposal_court
    # Monthly emergency-alert DRILL — the first Monday of the month at noon
    # (dow:["mon"] + dom_max:7 = a Monday on day ≤7 = the first Monday). Fires
    # the same clearly-labeled "this is only a test" emergency broadcast as the
    # manual test_emergency_alert (the critical EAS tone + spoken test on the
    # Satellite1, presence-gated, AND a high-severity household push) so the
    # whole alert path is exercised on a cadence — catching a broken voice/push
    # chain before a real CO₂-leak / tornado alert needs it. Owner/household-
    # gated (the tool's own rule). The background_job audit row (name) labels it
    # distinctly from a manual test.
    - name: monthly_emergency_drill
      at: "12:00"
      dow: [ "mon" ]
      dom_max: 7
      tool: test_emergency_alert
      input:
        tone: critical
    # Daily at 03:30 — the unified per-user model's synthesis tick. Walks the
    # active roster × the facet taxonomy (style/interests/routines/…) and
    # re-distills ONLY the threshold-crossed facets on a cheap tier (the idle-
    # at-3am 9B via HEARTH_USER_MODEL_TIER, default 'planner'). The afferent
    # observers feed observations all day; this distills them at night so the
    # resolver injects fresh facets. DARK until HEARTH_USER_MODEL=1; manual
    # catch-up via fire_background_job?name=sweep_user_models.
    - name: sweep_user_models
      at: "03:30"
      tool: sweep_user_models
    - name: sweep_person_facts
      at: "03:45"
      tool: sweep_person_facts
    # Daily at 08:15 — the Household Knowledge Graph followup sweep. Date-scans
    # goods for closing return windows / expiring warranties and, on the edge
    # (once per good+kind), files a followup action_proposal so Kate offers to
    # act. Deciding it accrues Trust-Ladder XP. DARK until HEARTH_HOUSEHOLD_GRAPH=1;
    # manual catch-up via fire_background_job?name=good_followups.
    - name: good_followups
      at: "08:15"
      tool: scan_good_followups
    # Weekly, Sunday 04:40 — the Services & Bills learner (Phase A executive-
    # assistant endgame). Deterministic recurring-sender clustering over the
    # last ~90 days of inbound mail feeds ONE deep-tier classification call;
    # accepted services upsert household_service ledger notes keyed on the
    # vendor anchor (idempotent refresh — never duplicates). Fail-open: a
    # missed service is caught by the next weekly pass. DARK until
    # HEARTH_HOUSEHOLD_SERVICES=1; manual catch-up via
    # fire_background_job?name=learn_household_services.
    - name: learn_household_services
      at: "04:40"
      dow: [ "sun" ]
      tool: learn_household_services
    # Daily at 08:35 — the Phase C anticipation probe over the Services &
    # Bills ledger: pure cadence math finds EXPECTED-but-missing bills ("the
    # Cox bill usually lands around the 12th and hasn't" — muted by ANY
    # inbound vendor mail this cycle; generous grace, 'around' phrasing,
    # never 'overdue') and gone-quiet services (≥2.5 cadence cycles silent →
    # offer to mark lapsed). Files once-only cordoned advisory proposals
    # (exists_for_signature per service+cycle); deciding accrues XP. No LLM.
    # DARK until HEARTH_BILL_ANTICIPATION=1; manual catch-up via
    # fire_background_job?name=expected_bills.
    - name: expected_bills
      at: "08:35"
      tool: scan_expected_bills
    # Daily at 08:20 — the Calendar Knowledge Graph followup sweep. Date-scans
    # upcoming birthdays (→ a gift from tracked likes within a learned budget),
    # vacations (→ flight details + welcome-back), and appointments (→ address +
    # drive-time prep) and, on the edge (once per event), files a followup
    # action_proposal so Kate offers to act. Deciding it accrues Trust-Ladder XP.
    # DARK until HEARTH_CALENDAR_TRIGGERS=1; manual catch-up via
    # fire_background_job?name=calendar_followups.
    - name: calendar_followups
      at: "08:20"
      tool: scan_calendar_followups
    # Daily at 08:25 — the cross-signal "I noticed" fusion sweep. Detects
    # COINCIDENCES across upcoming calendar signals: a visitor whose
    # birthday/anniversary lands inside their visit window (→ offer a gift + a
    # plan), and two of the owner's events whose times overlap (→ a heads-up).
    # On the edge (once per coincidence) it files a nudge action_proposal so Kate
    # OFFERS to act; deciding it accrues Trust-Ladder XP. DARK until
    # HEARTH_CROSS_SIGNAL=1; manual catch-up via
    # fire_background_job?name=cross_signals.
    - name: cross_signals
      at: "08:25"
      tool: scan_cross_signals
    # Daily at 08:30 — People-engine Phase B: "before you see them" prep. Scans the
    # next couple of days of calendar meetings for ones that NAME a person in the
    # contact graph and, on the edge (once per person+meeting), files a briefing —
    # what's open with them (open loops), what's worth bringing up (the synthesis
    # narrative + recent life events), and whether you're overdue. Pure assembly of
    # knowledge the system already produced (no LLM). A briefing self-expires, so a
    # prep for a past meeting doesn't linger. Relationship counterpart of
    # calendar_followups (which fires on the calendar's OWN concerns). DARK until
    # HEARTH_MEETING_PREP=1; manual catch-up via fire_background_job?name=meeting_prep.
    - name: meeting_prep
      at: "08:30"
      tool: scan_meeting_prep
    # Daily at 03:45 — the iMessage observer's distill tick (the People
    # reasoning substrate's richest friend signal). Consumes the transient
    # iMessage windows the macOS app uploaded for OPTED-IN contacts, distills
    # them into durable People-note facts + relationship observations
    # (open loops / life events / topics), then DROPS the raw — Hearth keeps
    # only the distillate, never an archive of message history. Cadence-gated
    # (HEARTH_IMESSAGE_DISTILL_MIN_INTERVAL_H, default 20h) so the distill clock
    # is decoupled from the frequent upload clock. DARK until
    # HEARTH_IMESSAGE_OBSERVER=1; manual catch-up via
    # fire_background_job?name=distill_imessage.
    - name: distill_imessage
      at: "03:45"
      tool: distill_imessage_observations
    # Daily at 04:00 — the People-engine synthesis/promotion pass, AFTER the 03:45
    # distill so it works the freshest observations. Per person with new observation
    # activity it PROMOTES durable/recurring stream signal up into the dossier
    # (communal facts → the People note via merge_facts; the relationship narrative —
    # portrait + recurring themes — → the cordoned person_synthesis store), DECAYS
    # the ephemeral (the model's resolved/trivial judgments + a per-kind TTL age-out
    # backstop) and converts genuinely actionable open loops into Kate followup
    # action_proposals. The GATE (durability + importance) is the deep-tier model's
    # judgment; the code only applies it. Cadence-gated (HEARTH_PEOPLE_SYNTHESIS_MIN_INTERVAL_H,
    # default 20h) + dirty-gated (unchanged contact → no LLM call). DARK until
    # HEARTH_PEOPLE_SYNTHESIS=1; manual catch-up via
    # fire_background_job?name=synthesize_dossiers.
    - name: synthesize_dossiers
      at: "04:00"
      tool: synthesize_person_dossiers
    # Daily at 03:50 — People-engine Phase C: BETWEEN the 03:45 distill (which creates
    # fresh life_event observations) and the 04:00 synthesis (which PROMOTES an
    # actionable life event to a durable theme and then DECAYS the raw observation —
    # so running after it would miss exactly the actionable ones). Scans the
    # relationship life-event observation stream (a friend's trip / new job /
    # engagement / move / loss) for a NEW, ACTIONABLE milestone within a recency
    # window and, on the edge (once per event), files a proactive Kate action_proposal
    # offer ("Kim's heading to Bali — want me to wish them a great trip and check their
    # flights?"). Two gates — a deterministic recency window plus the model's
    # actionability judgment (fail-CLOSED, so an LLM outage files nothing rather than
    # offering on noise). Relationship-signal sibling of calendar_followups; different
    # source (observations vs projected calendar notes), no overlap. DARK until
    # HEARTH_LIFE_EVENT_OFFERS=1; manual catch-up via
    # fire_background_job?name=life_event_offers.
    - name: life_event_offers
      at: "03:50"
      tool: scan_life_events
  # ── Standing duties (2026-08-03) ────────────────────────────────────────
  # The scheduled rota, moved out of `deliberation_addendum` prose and into
  # data the runtime resolves. The prose form asked the pass to do three things
  # before it got to the part it's good at: work out the weekday ("MONDAYS only
  # (check the date line)"), pick a parameter from it ("days_ahead=60 on
  # Mondays, 7 the other mornings"), and compute a window ("inside 14 days").
  # Day-of-week is the exact reasoning the runtime already distrusts enough to
  # ship an 8-day anchor table for — and when it slipped there was no error,
  # just a Monday pass that silently didn't happen.
  #
  # `render_standing_duties` now filters to what is ACTUALLY due for this slot
  # and date and hands over absolute dates. A duty that isn't due isn't in the
  # prompt at all, so it can neither be forgotten nor run on the wrong day.
  # What stays in `judgment` is what a table can't hold: what counts as a
  # finding. Guarded by `bun run smoke:standing-duties`.
  standing_duties:
    - id: pets_glance
      title: Pets
      slots: [ "07:00" ]
      steps:
        - tool: read_friday_pets
      windows:
        refill_running_out: 10
      judgment: >-
        A refill running out on or before refill_running_out, or a flagged
        follow-up date, gets one brief line — or a proposal when it needs an
        action ("call the vet for a refill"). Otherwise nothing.
    - id: ev_glance
      title: EV
      slots: [ "07:00" ]
      steps:
        - tool: plan_ev_day
          note: only if today's calendar has a real trip; otherwise skip this duty entirely
        - tool: ha_get_state
          note: to confirm the charge covers that trip
      judgment: >-
        Short for the trip → a brief line. No trip, or covered → nothing.
    - id: house_pulse
      title: House pulse
      slots: [ "07:00" ]
      steps:
        - tool: house_climate
        - tool: house_energy
          note: only on a sunny day, or when usage is what's in question
      judgment: >-
        Report ONLY an anomaly: HVAC running hard against a big outdoor delta,
        a zone far off the others or off setpoint, solar well under a clear
        sky, usage spiking with nobody home. Nominal → nothing.
    - id: house_steward
      title: House steward pass
      slots: [ "07:00" ]
      dow: [ mon ]
      steps:
        - tool: read_note
          input: { path: "Knowledge/Luna/maintenance-cadence.md" }
        - tool: read_note
          input: { path: "Knowledge/Luna/maintenance-log.md" }
        - tool: weather_forecast
          note: a first hard freeze pulls winterization to "now"; hail since last week queues an exterior check
      windows:
        due_or_overdue: 14
        lead_time_items: 90
      judgment: >-
        Diff the cadence against the log. Household-doable → a brief line;
        needs a provider → propose_action naming the provider from
        service-providers.md and the lead time. Completed work you learn of →
        log it with update_luna_vault.
    - id: envelope_trend
      title: Envelope trend
      slots: [ "07:00" ]
      dow: [ mon ]
      steps:
        - tool: house_thermal_history
          input: { hours: 168 }
        - tool: read_note
          input: { path: "Knowledge/Luna/house-log.md" }
          note: your 05:10 job writes one dated line per day — the long memory past the recorder's ~10 days
      judgment: |-
        Worth a `watching` line, and NAME THE NUMBER ("basement τ fell
        40h→22h"): a zone whose loss rate JUMPED, duty climbing while the
        weather didn't (check the log's wind line — a windy week loses more at
        the same ΔT), short-cycling, or the solar yield index sagging at like
        irradiance (dirty panels?).
        The `envelope` block prices the shell: the leakage index (est. HVAC kWh
        per degree-day) rising at like weather means seals or insulation
        regressed; falling after a fix is money saved. Per-zone calm-vs-windy
        loss rates say WHICH: windy ≫ calm is infiltration (weatherstripping),
        similar is conduction (insulation). A sustained regression suggesting
        real work → propose_action with the evidence. Data thinner than the
        window → report the tool's caveat, never a guessed coefficient.
        THE CAR IS NOT THE HOUSE. The log's EV line (load-classified charging
        minutes × the 5.76 kW EVSE — "plugged" ≠ charging) explains usage
        spikes: a 140 kWh day with 50 kWh of EV is a normal house day plus a
        charge, not a consumption anomaly. Compare the "house" number
        day-over-day, never raw usage, before calling anything a spike.
    - id: occasions_sweep_weekly
      title: Occasions — the full planning sweep
      slots: [ "07:00" ]
      dow: [ mon ]
      steps:
        - tool: upcoming_dates
          input: { days_ahead: 60 }
      windows:
        shipped_gift_by: 14
        reservation_by: 7
        card_by: 5
        gift_intel_horizon: 30
      judgment: >-
        For each hit, is it inside its lead-time window above? If so, read the
        person's note for the gift file and propose the concrete plan (idea,
        budget shape, order-by date) — ONE proposal per occasion, and only as
        it ENTERS the window. Further out but notable (a milestone, an
        anniversary worth a real plan) → one line in `watching`. An empty gift
        file on someone whose occasion falls inside gift_intel_horizon → one
        `watching` line ("no gift intel on Kim yet — listening for signals"),
        not a question unless the window is getting tight.
    - id: occasions_sweep_daily
      title: Occasions — the catch-net
      slots: [ "07:00" ]
      dow: [ tue, wed, thu, fri, sat, sun ]
      steps:
        - tool: upcoming_dates
          input: { days_ahead: 7 }
      windows:
        shipped_gift_by: 14
        reservation_by: 7
        card_by: 5
      judgment: >-
        The catch-net between Monday sweeps — same lead-time rule, one proposal
        per occasion only as it ENTERS its window.
    - id: midnight_perimeter
      title: Midnight perimeter sweep
      slots: [ "00:00" ]
      steps:
        - tool: unifi_security_snapshot
          note: empty posture_findings and no offline cameras is the expected result and needs no report
        - tool: unifi_inbound_flows
          note: blocked scanner noise is the normal background of any WAN link and is NOT a finding; an ALLOWED incoming connection on an unexpected port is
        - tool: tempest_conditions
          note: only if there's active weather worth a morning mention
      judgment: >-
        This is NOT a brief slot. Write no brief, wake nobody, send nothing
        unless you find something real — the house is asleep. Nothing found →
        log nothing, say nothing, end the pass; that is the overwhelmingly
        common case and it is a success. A genuine finding folds into the
        07:00 brief's watching section. Only a live safety or intrusion signal
        justifies waking him at this hour.
    - id: proposal_review
      title: Rule on what's waiting
      slots: [ "*" ]
      steps:
        - tool: list_proposals_for_review
      judgment: >-
        See the build-queue section below for how to rule.

  # Curated tool surface for chat turns (llm_role 'specialist'). Kate's
  # capabilities grant a broad set; showing all of it every turn bloats
  # the prompt and dilutes tool selection. This keeps her COS core —
  # drafting, briefing, calendar, verification reads, style learning —
  # and drops domain-specialist tools (pets, genealogy, perimeter, EV,
  # codebase), which she reaches via consult_specialist instead.
  tools_for_chat:
    - read_inbox
    - consult_specialist
    # Sub-agent delegation (2026-07-03): a domain task for a teammate runs in
    # THEIR context and hands back a digest — prefer over consult for WORK.
    - delegate
    # Told-first Services & Bills writes (2026-07-05) — THE ledger mutation
    # tool ("CityFiber is $100/mo", "cancel Twitch", "Cox isn't ours").
    - manage_household_services
    - consult_deep_model
    - draft_message
    - present_questions
    # Krea 2 chat images (2026-07-20) — show, don't tell.
    - generate_image
    - propose_action
    - delegate_proposal
    - list_changes_for_review
    - review_change
    # What can't we do yet? (2026-07-14) — the clustered tool-surface miss
    # report; recurring real gaps become file_build_request specs.
    - read_capability_demand
    # Service mode (2026-07-08, owner-only): reveal your own persona / system
    # prompt / config / capabilities / tools / raw YAML on request ("show me
    # your persona", "enter service mode"). Reads the real loaded config.
    - reveal_self
    # Service mode (owner-only): pin your spoken voice register ("speak warmer",
    # "use your tender voice", "just read the room" = auto, "go back to neutral")
    # or report it. Persists a per-user preference the voice orb applies.
    - set_voice_emotion
    # Owner-only (2026-07-21): read Jasper's OWN recent thread with another
    # specialist as a transcript, so you work from the real conversation when he
    # references it ("what did Mariah and I land on?"). Reads his threads only.
    - read_specialist_conversation
    # Service mode Phase B (owner-only): diagnose the the LLM host Docker stack —
    # list_services (inventory), diagnose_service (state + logs → you reason
    # over the evidence), restart_container (allowlist-gated at the relay).
    # "Is Plex down?", "what's wrong with the server?".
    - list_services
    - diagnose_service
    - restart_container
    # Host power (owner-only) — "wake the workstation", "put the workstation back to sleep".
    - list_power_hosts
    - wake_host
    - sleep_host
    # Host diagnostics (2026-07-25): the layer BELOW the containers — driver vs
    # kernel module, disk, thermals, dmesg, config files. Read-only, sandboxed.
    - diagnose_host
    # Court scorecard (trust-teeth Phase 1): "how's the court doing?" — per-lens
