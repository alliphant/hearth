  # Curated tool surface for the VOICE surface (Satellite1 → openai_shim →
  # surface:'voice'). MUCH tighter than tools_for_chat because each tool's
  # serialized JSON schema is prefill the small/fast voice model pays on
  # EVERY spoken turn — Kate's 37-tool chat surface is ~9.8K+ tokens of tool
  # defs alone, the bulk of an 18.7K-token voice prompt (measured 2026-06-07).
  # A spoken receptionist answers reads (calendar, weather), makes the one
  # common voice write (schedule), and escalates everything else via
  # consult_specialist (appended by the runtime automatically — no need to
  # list it) or consult_deep_model. Everything heavier (drafting, proposals,
  # routing, hiring, code review, style memory, web research) is a consult
  # away. Omit this list to fall back to tools_for_chat.
  tools_for_voice:
    - sensor_calendar_upcoming
    - sensor_in_meeting
    - sensor_free_blocks
    - weather_now
    - weather_forecast
    - weather_alerts
