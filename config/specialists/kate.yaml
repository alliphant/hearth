  # dependency breaks. Gates her scan_system_health background job (probe +
  # audit-log error-rate sweep → incident ledger → on a down edge, file a miss
  # for Beatrice + flag her + push Jasper) and her system_health read tool.
  # Beatrice fixes (remediate_infra). The 8-day silent Firecrawl outage is why.
  monitor_system_health: true
  # Capability yield (2026-08-01): the sibling signal to system health, for the
  # failure error rate CANNOT see — a background job that returns ok:true every
  # run and writes nothing. extract_meeting_votes ran 59 times, fetched 82
  # documents, recorded 3 votes, and every detector called it healthy. Gates her
  # scan_capability_yield job (deterministic SQL over audit rows already on
