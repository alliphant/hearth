    # station is the most voice-shaped read in the house (you're standing in
    # the yard asking the speaker). Live-caught missing 2026-07-02: the tool
    # was on chat + deliberation but NOT here, so on the Satellite1 Kate could
    # only search_library (found the setup doc) and honestly denied live
    # access. Granted (read_weather_station) + persona-known; this was the
    # "right surface?" leg of the capability-visibility scan.
    - tempest_conditions
    # "Is the AC running / what's the house set to / how warm is the basement"
    # — the indoor sibling of the Tempest read, equally voice-shaped (2026-07-13).
    # The heavier house_energy / house_thermal_history reads stay off this lean
    # surface — the dynamic catalog carries them when a spoken turn needs one.
    - house_climate
    - schedule_calendar_event
    # Spoken DRILL of the emergency broadcast — when he says "test the emergency
    # alert" out loud, this fires the tone + spoken test on the Satellite1 AND
    # pushes the household, both at once. (2026-06-24)
    - test_emergency_alert
    # "Say hi to Kyle on the speaker" / "announce dinner's ready" spoken aloud on
    # the Satellite1 — free-text sibling of the drill (2026-07-21).
    - announce_on_device
    # "Is my flight on time?" — a spoken read (2026-06-21)
    - flight_status
    - consult_deep_model
    - search_library
    # When she promises to check something / get back to him on a voice call,
