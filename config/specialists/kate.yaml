  # Dynamic tool surface (2026-06-08) — chat AND voice turns (voice parity added
  # 2026-07-08). Kate is made AWARE of
  # her FULL granted toolkit (cheap name+description catalog) while only a
  # small message-ranked HOT set ships full JSON schemas; a `load_tools`
  # meta-tool pulls any other tool's schema on demand. This cuts the ~9.8K
  # tokens of unused tool schemas she paid on every chat turn while KEEPING
  # full reach (no more curation-by-hiding). `tools_for_chat` above is retained
  # — in dynamic mode it's the ranking prior + the fail-open surface when
  # embeddings are down. Fail-open: embeddings off / non-chat surface ⇒
  # byte-identical to the curated path. Env HEARTH_DYNAMIC_TOOLS=0 disables.
  dynamic_tools: true
  # Kate's can't-miss floor: pinned into the hot set on EVERY dynamic turn,
  # alongside the global floor (search_library, present_questions). The
  # calendar read is the chief-of-staff's #1 domain, but on a terse message
  # the tool-RAG ranking has nothing to bite on — a one-word "Call" turn
  # (2026-07-15) ranked zero calendar tools hot and Kate burned the turn
  # looping search_library into a blank_turn_fallback. Keep this list tiny:
  # every entry ships its full JSON schema every turn.
  dynamic_tools_floor:
    - sensor_calendar_upcoming
    # A "who works here" question must never miss the tool-RAG cut and fall
    # back to recall — that failure mode is invented colleagues, not a shrug.
    - read_specialist_spec

  # Reactive triggers (2026-07-04, folded from Luna + Iris): the arrival /
  # departure wakes are Kate's own now — she reads the house and the car
  # herself and acts directly (a push for something urgent, a proposal for
  # something schedulable); nothing to hand off. Same edge-detected +
  # debounced + deep-tier spine (HEARTH_REACTIVE_TRIGGERS kill switch).
  triggers:
    - def: home_arrival
      task: >-
        A household member just got home. Quick reads, act only on what
        genuinely needs attention: the house (HVAC, locks, leak/temp/security
        sensors, recent peer flags) and the EV if they likely plugged in
        (SoC vs tomorrow's first trip — ha_get_state / plan_ev_day).
        Urgent → push; schedulable → propose_action; nominal → stay quiet.
      min_interval_ms: 1800000
    - def: home_departure
      task: >-
        A household member just left. Quick "secured for an empty house"
        pass — doors/locks, garage, windows, lights/HVAC worth adjusting.
        Something genuinely wrong → push it; otherwise note all-secure and
        stay quiet.
      min_interval_ms: 1800000

