<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Ride Log</title>
<style>
  :root{
    --bg:#15100a; --bg2:#1d1610; --surface:#241c13; --surface2:#2c2218;
    --line:#3a2c1d; --line2:#4a3826;
    --ink:#efe3cd; --muted:#b29c7e; --faint:#80705a;
    --gold:#d8ad4a; --gold-bright:#f5d98c; --ember:#c8531f; --oak:#86a06a;
    --teal:#5aa6a0;
    --z1:#7a8ea6; --z2:#4a8fd6; --z3:#3fae6e; --z4:#e08a2e; --z5:#d64a4a;
    --shadow:0 6px 22px rgba(0,0,0,.38);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #2a2012 0%, transparent 60%),
      linear-gradient(160deg,#15100a,#120d08);
    color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .wrap{max-width:880px; margin:0 auto; padding:1.6rem 1.2rem 5rem}
  .topbar{display:flex; align-items:baseline; gap:.9rem; flex-wrap:wrap; margin-bottom:1.1rem}
  .topbar h1{font:600 1.7rem/1 Georgia,"Iowan Old Style",serif; letter-spacing:.2px; margin:0; color:#f4ead4}
  #status{font-size:.72rem; color:var(--faint); display:flex; align-items:center; gap:.4rem}
  #status .dot{width:7px;height:7px;border-radius:50%;background:var(--oak); box-shadow:0 0 8px var(--oak)}
  #status.err .dot{background:var(--ember); box-shadow:0 0 8px var(--ember)}
  .filters{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.2rem}
  .chip{
    font-size:.8rem; color:var(--muted); background:transparent;
    border:1px solid var(--line2); padding:.24rem .7rem; border-radius:999px;
    cursor:pointer; transition:all .15s;
  }
  .chip:hover{color:var(--ink); border-color:var(--gold)}
  .chip.active{color:var(--gold-bright); background:rgba(216,173,74,.12); border-color:rgba(216,173,74,.5)}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.9rem; margin-bottom:1.4rem}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.8rem 1rem; box-shadow:var(--shadow)}
  .stat .k{font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
  .stat .v{font:600 1.45rem/1.2 Georgia,serif; color:#f4ead4; margin-top:.12rem}
  .stat .v small{font-size:.8rem; color:var(--muted); font-family:system-ui}

  .ride{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:1.05rem 1.2rem; margin-bottom:1.05rem; box-shadow:var(--shadow);
    cursor:pointer; transition:border-color .2s;
  }
  .ride:hover{border-color:var(--line2)}
  .ride.open{border-color:rgba(216,173,74,.45)}
  .ride .when{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; font-size:.78rem; color:var(--faint)}
  .ride .when .type{
    color:var(--gold); background:rgba(216,173,74,.1); border:1px solid rgba(216,173,74,.3);
    padding:.08rem .55rem; border-radius:999px; font-size:.74rem;
  }
  .ride .when .wx{color:var(--muted)}
  .ride h2{
    font:600 1.22rem/1.35 Georgia,"Iowan Old Style",serif; color:#f6edd9;
    margin:.45rem 0 .55rem; letter-spacing:.1px;
  }
  .ride h2 .unnamed{color:var(--muted); font-style:italic; font-weight:400}
  .metrics{display:flex; gap:.45rem .55rem; flex-wrap:wrap; margin-bottom:.65rem}
  .m{
    font-size:.8rem; color:var(--ink); background:var(--surface2);
    border:1px solid var(--line); border-radius:8px; padding:.18rem .55rem;
    white-space:nowrap;
  }
  .m b{font-weight:600; color:#f4ead4}
  .m .lbl{color:var(--faint); font-size:.72rem; margin-right:.28rem}
  .m.gain b{color:var(--oak)}
  .m.hr b{color:var(--z4)}
  .m.pw b{color:var(--teal)}
  .sparks{display:grid; grid-template-columns:1fr 1fr; gap:.7rem; align-items:end}
  @media (max-width:640px){ .sparks{grid-template-columns:1fr} }
  .spark{background:#1a140d; border:1px solid var(--line); border-radius:10px; padding:.5rem .6rem .3rem; min-height:74px}
  .spark .t{font-size:.66rem; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:.15rem}
  .spark svg{display:block; width:100%; height:48px}
  .spark .ph{height:48px; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:.72rem}
  .zonebar{display:flex; height:8px; border-radius:5px; overflow:hidden; margin-top:.7rem; background:#000a}
  .zonebar span{height:100%}
  .zonekey{display:flex; gap:.8rem; font-size:.66rem; color:var(--faint); margin-top:.3rem}
  .zonekey i{font-style:normal}

  .detail{display:none; margin-top:.9rem; border-top:1px solid var(--line); padding-top:.8rem}
  .ride.open .detail{display:block}
  .cues h3{font:600 .72rem/1 system-ui; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.2rem 0 .6rem}
  .cue{display:flex; gap:.6rem; margin-bottom:.55rem; font-size:.86rem}
  .cue .at{color:var(--faint); font-size:.74rem; min-width:46px; padding-top:.1rem; font-variant-numeric:tabular-nums}
  .cue .txt{color:var(--ink)}
  .cue .trig{color:var(--gold); font-size:.68rem; letter-spacing:.04em; margin-left:.4rem}
  .empty{color:var(--muted); text-align:center; padding:3rem 1rem; font-size:.95rem}
  .empty a{color:var(--gold)}
  path.draw{stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.1s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Ride Log</h1>
    <span id="status"><span class="dot"></span><span id="status-text">loading…</span></span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="stats" id="stats"></div>
  <div id="rides"></div>
</div>
<script src="/app/rides/rides.js"></script>
</body>
</html>
